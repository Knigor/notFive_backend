name: notfive-dev

services:
  app:
    image: notfive:local
    env_file:
      - path: .env.local
        required: false
    build:
      context: .
      target: production
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:80'
    environment:
      APP_ENV: dev
      APP_DEBUG: '1'
      APP_SECRET: ${APP_SECRET:-notfive-local-development-only}
      JWT_SECRET: ${JWT_SECRET:-notfive-local-jwt-secret-change-in-production-2026}
      APP_CORS_ORIGIN: ${APP_CORS_ORIGIN:-http://localhost:5173}
      DEFAULT_URI: ${DEFAULT_URI:-https://api.galaxiit.ru}
      POSTGRES_HOST: database
      POSTGRES_DB: ${POSTGRES_DB:-notfive}
      POSTGRES_USER: ${POSTGRES_USER:-notfive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notfive-local-only}
      MAILER_DSN: ${LOCAL_MAILER_DSN:-smtp://mailpit:1025}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-notfive@localhost.invalid}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      DIGEST_SERVICE_TOKEN: ${DIGEST_SERVICE_TOKEN:-}
      GO_SERVICE_URL: ${GO_SERVICE_URL:-}
    volumes:
      - ./src:/app/src:ro
      - ./templates:/app/templates:ro
      - ./translations:/app/translations:ro
      - ./config:/app/config:ro
      - ./public:/app/public:ro
      - dataset_files:/app/var/datasets
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started

  telegram:
    profiles: ['telegram']
    image: notfive:local
    user: www-data
    command: ['php', 'bin/console', 'telegram:poll', '--no-interaction']
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      disable: true
    environment:
      APP_ENV: dev
      APP_DEBUG: '1'
      APP_SECRET: ${APP_SECRET:-notfive-local-development-only}
      POSTGRES_HOST: database
      POSTGRES_DB: ${POSTGRES_DB:-notfive}
      POSTGRES_USER: ${POSTGRES_USER:-notfive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notfive-local-only}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
    volumes:
      - ./src:/app/src:ro
      - ./translations:/app/translations:ro
      - ./config:/app/config:ro
    depends_on:
      database:
        condition: service_healthy

  digest_worker:
    profiles: ['worker']
    image: notfive:local
    user: www-data
    command: ['php', '-d', 'max_execution_time=0', 'bin/console', 'digest:process-runs', '--no-interaction']
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      disable: true
    environment:
      APP_ENV: dev
      APP_DEBUG: '1'
      APP_SECRET: ${APP_SECRET:-notfive-local-development-only}
      POSTGRES_HOST: database
      POSTGRES_DB: ${POSTGRES_DB:-notfive}
      POSTGRES_USER: ${POSTGRES_USER:-notfive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notfive-local-only}
      DIGEST_SERVICE_TOKEN: ${DIGEST_SERVICE_TOKEN:-}
      GO_SERVICE_URL: ${GO_SERVICE_URL:-}
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./translations:/app/translations:ro
      - dataset_files:/app/var/datasets
    depends_on:
      database:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'

  database:
    image: postgres:17-alpine
    ports:
      - '172.17.0.1:20167:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notfive}
      POSTGRES_USER: ${POSTGRES_USER:-notfive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notfive-local-only}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  database_data:
  dataset_files:
