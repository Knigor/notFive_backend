<VirtualHost *:80>
    SetEnvIfNoCase Authorization "(.+)" HTTP_AUTHORIZATION=$1
    DocumentRoot /app/public

    <Directory /app/public>
        AllowOverride None
        Require all granted
        Options -Indexes
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    ErrorLog /proc/self/fd/2
    SetEnvIf Request_URI "^((/index[.]php)?/email/(confirm|unsubscribe))$" email_token_route=$1
    LogFormat "%h %l %u %t \"%m %<{email_token_route}e %H\" %>s %b" email_without_query
    CustomLog /proc/self/fd/1 combined env=!email_token_route
    CustomLog /proc/self/fd/1 email_without_query env=email_token_route
</VirtualHost>
