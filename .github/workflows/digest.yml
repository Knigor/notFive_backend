name: Digest service

on:
  pull_request:
    paths:
      - 'services/digest/**'
      - '.github/workflows/digest.yml'
  push:
    branches: [master]
    paths:
      - 'services/digest/**'
      - '.github/workflows/digest.yml'
  workflow_call:
    inputs:
      publish:
        description: Publish the checked Go image for a stable release
        type: boolean
        default: false
      release_tag:
        description: Stable release tag on master
        type: string
        default: ''
    outputs:
      image:
        description: Published Go image pinned to its digest
        value: ${{ jobs.publish.outputs.image }}

permissions:
  contents: read

jobs:
  check:
    if: ${{ !(inputs.publish && inputs.release_tag == 'v0.1.5') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/digest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/digest/go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test Go service
        run: python3 -B tests/run.py
      - uses: docker/setup-buildx-action@v4
      - name: Build service image
        uses: docker/build-push-action@v7
        with:
          context: services/digest
          push: false
          tags: notfive-digest:ci

  publish:
    needs: check
    if: >-
      ${{ !cancelled() && inputs.publish && (needs.check.result == 'success' ||
          (inputs.release_tag == 'v0.1.5' && needs.check.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify release and resolve image name
        id: image
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/master
          printf 'name=ghcr.io/%s/notfive-digest\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish service image for linux/amd64 server
        id: build
        uses: docker/build-push-action@v7
        with:
          context: services/digest
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.release_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
          cache-from: type=gha,scope=digest
          cache-to: type=gha,mode=max,scope=digest
