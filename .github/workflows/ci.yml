name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_IMAGE: notfive:ci
      APP_SECRET: ci-only-secret
      JWT_SECRET: ci-only-jwt-secret-for-integration-tests-2026
      ADMIN_BOOTSTRAP_USERNAME: ci_admin
      ADMIN_BOOTSTRAP_PASSWORD: ci-only-admin-password-2026
      APP_CORS_ORIGIN: http://localhost:5173
      POSTGRES_PASSWORD: ci-only-password
      DEFAULT_URI: http://localhost:8080
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment configuration and rollback
        run: |
          sh -n deploy/deploy.sh
          python3 -B scripts/deploy-config-smoke.py
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: notfive:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Composer lock file
        run: |
          docker build --target dependencies -t notfive:dependencies .
          docker run --rm --entrypoint composer notfive:dependencies validate --strict
      - name: Lint PHP
        run: make lint-all
      - name: Check Telegram polling
        run: |
          docker run --rm -v "$PWD":/app -w /app --entrypoint php notfive:dependencies -d zend.assertions=1 -d assert.exception=1 scripts/telegram-unit-smoke.php
          docker run --rm -v "$PWD":/app -w /app --entrypoint php notfive:dependencies -d zend.assertions=1 -d assert.exception=1 scripts/telegram-poll-smoke.php
      - name: Check digest assembly
        run: docker run --rm -v "$PWD":/app -w /app --entrypoint php notfive:dependencies -d zend.assertions=1 -d assert.exception=1 scripts/digest-build-smoke.php
      - name: Start production stack
        run: docker compose -f compose.prod.yaml up -d --no-build --wait --wait-timeout 120
      - name: Validate Symfony and test HTTP/database
        run: |
          docker compose -f compose.prod.yaml exec -T app php bin/console lint:container
          docker compose -f compose.prod.yaml exec -T app php bin/console lint:yaml config
          docker compose -f compose.prod.yaml exec -T app php bin/console lint:yaml translations
          docker compose -f compose.prod.yaml exec -T app php bin/console lint:twig templates
          docker compose -f compose.prod.yaml exec -T app app-migrate
          docker compose -f compose.prod.yaml exec -T app php bin/console graphql:dump-schema --format=graphql --with-descriptions --file=/tmp/schema.graphql
          docker compose -f compose.prod.yaml exec -T app cmp schema.graphql /tmp/schema.graphql
          sh scripts/smoke.sh
          sh scripts/graphql-smoke.sh
          sh scripts/graphql-auth-smoke.sh
      - name: Check API documentation
        run: |
          docker compose -f compose.prod.yaml exec -T app php bin/console nelmio:apidoc:dump --format=json > /tmp/notfive-api-doc-prod.json
          docker compose -f compose.prod.yaml exec -T app env APP_ENV=dev APP_DEBUG=1 php bin/console nelmio:apidoc:dump --format=json > /tmp/notfive-api-doc-dev.json
          python3 - <<'PY'
          import json

          with open('/tmp/notfive-api-doc-prod.json') as file:
              production = json.load(file)
          with open('/tmp/notfive-api-doc-dev.json') as file:
              development = json.load(file)

          artifact_paths = {
              '/api/runs/{runId}/artifacts/{filename}',
              '/api/runs/{runId}/artifacts.zip',
          }
          public_paths = {'/healthz', '/api/graphql', '/email/confirm', '/email/unsubscribe'}
          assert set(production['paths']) == public_paths | artifact_paths
          assert set(development['paths']) == {
              '/api/digest-email/preview', '/api/digest-email/send'
          } | public_paths | artifact_paths
          assert development['paths']['/api/graphql']['post']['requestBody']['content']['application/json']['schema']['properties']['query']['example'] == 'query Ping { ping }'
          assert 'startRunSites' in production['paths']['/api/graphql']['post']['requestBody']['content']['application/json']['examples']
          assert 'multipart/form-data' in production['paths']['/api/graphql']['post']['requestBody']['content']
          assert production['paths']['/api/runs/{runId}/artifacts.zip']['get']['security'] == [{'AdminBearer': []}]
          assert development['paths']['/api/digest-email/send']['post']['requestBody']['content']['application/json']['schema']['required'] == ['subject', 'digest', 'recipient']
          PY
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/doc)" = 404
      - name: Container logs
        if: failure()
        run: docker compose -f compose.prod.yaml logs --tail=100
      - name: Stop test stack
        if: always()
        run: docker compose -f compose.prod.yaml down --volumes
