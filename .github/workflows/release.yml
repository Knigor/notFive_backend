name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify-release:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require a version tag on master
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/master

  checks:
    needs: verify-release
    if: ${{ github.event.release.tag_name != 'v0.1.5' }}
    uses: ./.github/workflows/ci.yml

  digest:
    needs: verify-release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/digest.yml
    with:
      publish: true
      release_tag: ${{ github.event.release.tag_name }}

  publish:
    needs: [verify-release, checks]
    if: >-
      ${{ !cancelled() && needs.verify-release.result == 'success' &&
          (needs.checks.result == 'success' ||
           (github.event.release.tag_name == 'v0.1.5' && needs.checks.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve lowercase GHCR image name
        id: image
        run: printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release for linux/amd64 server
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [publish, digest]
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy exact published Symfony and Go images
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          MAILER_DSN: ${{ secrets.MAILER_DSN }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          EMAIL_DELIVERY_MODE: ${{ vars.EMAIL_DELIVERY_MODE || 'sync' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_BOOTSTRAP_USERNAME: ${{ secrets.ADMIN_BOOTSTRAP_USERNAME }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DIGEST_SERVICE_TOKEN: ${{ secrets.DIGEST_SERVICE_TOKEN }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'notfive' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'notfive' }}
          APP_CORS_ORIGIN: ${{ vars.APP_CORS_ORIGIN }}
          DEFAULT_URI: ${{ vars.DEFAULT_URI }}
          HTTP_PORT: ${{ vars.HTTP_PORT || '8080' }}
          GO_SERVICE_URL: ${{ vars.GO_SERVICE_URL || 'http://digest:8081' }}
          YANDEX_FOLDER_ID: ${{ vars.YANDEX_FOLDER_ID }}
          YANDEX_MODEL: ${{ vars.YANDEX_MODEL || 'yandexgpt-5.1' }}
          YANDEX_ANALYSIS_MODEL: ${{ vars.YANDEX_ANALYSIS_MODEL || 'aliceai-llm-flash' }}
          YANDEX_EXPORT_MODEL: ${{ vars.YANDEX_EXPORT_MODEL || 'aliceai-llm-flash' }}
          YANDEX_ANALYSIS_MAX_OUTPUT_TOKENS: ${{ vars.YANDEX_ANALYSIS_MAX_OUTPUT_TOKENS || '12000' }}
          YANDEX_EXPORT_MAX_OUTPUT_TOKENS: ${{ vars.YANDEX_EXPORT_MAX_OUTPUT_TOKENS || '8000' }}
          YANDEX_BASE_URL: ${{ vars.YANDEX_BASE_URL || 'https://ai.api.cloud.yandex.net/v1' }}
          YANDEX_SEARCH_DOMAINS: ${{ vars.YANDEX_SEARCH_DOMAINS || 'securitylab.ru,xakep.ru,habr.com,ptsecurity.com,kaspersky.ru' }}
          REQUEST_TIMEOUT: ${{ vars.REQUEST_TIMEOUT || '300s' }}
          MAX_CONCURRENT: ${{ vars.MAX_CONCURRENT || '2' }}
          MAX_OUTPUT_TOKENS: ${{ vars.MAX_OUTPUT_TOKENS || '8000' }}
          DIGEST_HTTP_PORT: ${{ vars.DIGEST_HTTP_PORT || '8081' }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST_IMAGE: ${{ needs.digest.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$IMAGE" =~ ^[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]
          [[ "$DIGEST_IMAGE" =~ ^[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]
          ssh_opts=(-p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          tar -czf - compose.prod.yaml compose.digest.yaml services/digest/compose.prod.yaml deploy/deploy.sh deploy/update-production-env.py deploy/update-mailer-env.sh deploy/update-telegram-env.sh deploy/update-jwt-env.sh deploy/update-admin-env.sh | ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'tar -xzf - -C /opt/notfive'
          python3 - <<'PY' | ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sh /opt/notfive/deploy/deploy.sh '$IMAGE' --config-from-stdin '$DIGEST_IMAGE'"
          import json
          import os
          import sys

          keys = '''
          APP_SECRET JWT_SECRET ADMIN_BOOTSTRAP_USERNAME ADMIN_BOOTSTRAP_PASSWORD
          POSTGRES_PASSWORD POSTGRES_DB POSTGRES_USER APP_CORS_ORIGIN DEFAULT_URI
          HTTP_PORT MAILER_DSN MAIL_FROM_ADDRESS EMAIL_DELIVERY_MODE TELEGRAM_BOT_TOKEN
          DIGEST_SERVICE_TOKEN GO_SERVICE_URL YANDEX_API_KEY YANDEX_FOLDER_ID
          YANDEX_MODEL YANDEX_ANALYSIS_MODEL YANDEX_EXPORT_MODEL
          YANDEX_ANALYSIS_MAX_OUTPUT_TOKENS YANDEX_EXPORT_MAX_OUTPUT_TOKENS
          YANDEX_BASE_URL YANDEX_SEARCH_DOMAINS REQUEST_TIMEOUT MAX_CONCURRENT
          MAX_OUTPUT_TOKENS DIGEST_HTTP_PORT
          '''.split()
          missing = [key for key in keys if not os.environ.get(key)]
          if missing:
              sys.exit('Missing production configuration: ' + ', '.join(missing))
          json.dump({key: os.environ[key] for key in keys}, sys.stdout)
          PY
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
