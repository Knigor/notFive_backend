name: notfive

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to a release tag or digest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:80'
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
      APP_CORS_ORIGIN: ${APP_CORS_ORIGIN:?Set APP_CORS_ORIGIN}
      SYMFONY_TRUSTED_PROXIES: private_ranges
      SYMFONY_TRUSTED_HEADERS: 'x-forwarded-for,x-forwarded-proto'
      DEFAULT_URI: ${DEFAULT_URI:?Set DEFAULT_URI}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-notfive@localhost.invalid}
      POSTGRES_HOST: database
      POSTGRES_DB: ${POSTGRES_DB:-notfive}
      POSTGRES_USER: ${POSTGRES_USER:-notfive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notfive}
      POSTGRES_USER: ${POSTGRES_USER:-notfive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  database_data:
