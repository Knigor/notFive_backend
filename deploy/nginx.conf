# Bootstrap only: install before issuing the certificate with Certbot.
# Certbot adds TLS and the HTTP redirect; do not overwrite its live config.
map $uri $notfive_log_request {
    ~^(/index[.]php)?/email/(confirm|unsubscribe)$ "$request_method $uri $server_protocol";
    default $request;
}

map $uri $notfive_log_referrer {
    ~^(/index[.]php)?/email/(confirm|unsubscribe)$ "-";
    default $http_referer;
}

log_format notfive_access '$remote_addr - $remote_user [$time_local] '
                         '"$notfive_log_request" $status $body_bytes_sent '
                         '"$notfive_log_referrer" "$http_user_agent"';

server {
    listen 80;
    server_name api.galaxiit.ru;
    access_log /var/log/nginx/notfive-access.log notfive_access;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 230s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
