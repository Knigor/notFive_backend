telegram:
    profile:
        description: "🌿 notFive — кибердайджест без лишнего шума.\n\nСобираем важные события ИБ, проверяем источники и показываем главное коротко и ясно. Первый выпуск готовится.\n\nНажмите Start, чтобы открыть меню и выбрать язык."
