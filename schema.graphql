type Query {
  ping: Int!
  availableSiteSources: [SiteSource!]!
  runStatus(runId: ID!): RunStatus
}

type SiteSource {
  id: ID!
  name: String!
  taskUrl: String!
  searchDomain: String!
  status: String!
}

type RunStatus {
  runId: ID!
  status: String!
  error: String
  createdAt: String!
  startedAt: String
  finishedAt: String
  files: [String!]!
}

type Mutation {
  login(input: AdminLoginInput!): AdminLoginPayload!
  startRun(input: RunStartInput!): RunStartPayload!
}

input AdminLoginInput {
  username: String!
  password: String!
}

type AdminLoginPayload {
  token: String!
  expiresIn: Int!
}

input RunStartInput {
  file: Upload
  sourceIds: [ID!]
  controlTime: String
}

scalar Upload

type RunStartPayload {
  runId: ID!
  imported: Int!
  rejected: Int!
  siteCount: Int!
  inputKind: String!
  dispatchStatus: String!
  status: String!
}
