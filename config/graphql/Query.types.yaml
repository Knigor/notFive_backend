Query:
    type: object
    config:
        fields:
            ping:
                type: Int!
                resolve: '@=query("App\\GraphQL\\Query\\PingQuery::ping")'
            publishedDigestDates:
                type: '[String!]!'
                resolve: '@=query("App\\GraphQL\\Query\\DigestQuery::publishedDigestDates")'
                complexity: '@=1'
            digest:
                type: Digest
                args:
                    date: String!
                resolve: '@=query("App\\GraphQL\\Query\\DigestQuery::digest", args["date"])'
                complexity: '@=childrenComplexity + 1'
            availableSiteSources:
                type: '[SiteSource!]!'
                resolve: '@=query("App\\GraphQL\\Query\\AvailableSiteSourcesQuery::availableSiteSources")'
                complexity: '@=childrenComplexity * 30 + 1'
            runStatus:
                type: RunStatus
                args:
                    runId: ID!
                resolve: '@=query("App\\GraphQL\\Query\\RunStatusQuery::runStatus", args["runId"])'
                complexity: '@=childrenComplexity + 1'

RunStatus:
    type: object
    config:
        fields:
            runId:
                type: ID!
            status:
                type: String!
            error:
                type: String
            createdAt:
                type: String!
            startedAt:
                type: String
            finishedAt:
                type: String
            files:
                type: '[String!]!'

SiteSource:
    type: object
    config:
        fields:
            id:
                type: ID!
            name:
                type: String!
            taskUrl:
                type: String!
            searchDomain:
                type: String!
            status:
                type: String!
