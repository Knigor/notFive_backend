Query:
    type: object
    config:
        fields:
            ping:
                type: Int!
                resolve: '@=query("App\\GraphQL\\Query\\PingQuery::ping")'
            availableSiteSources:
                type: '[SiteSource!]!'
                resolve: '@=query("App\\GraphQL\\Query\\AvailableSiteSourcesQuery::availableSiteSources")'
                complexity: '@=childrenComplexity * 30 + 1'

SiteSource:
    type: object
    config:
        fields:
            id:
                type: ID!
            name:
                type: String!
            taskUrl:
                type: String!
            searchDomain:
                type: String!
            status:
                type: String!
