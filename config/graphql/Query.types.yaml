Query:
    type: object
    config:
        fields:
            ping:
                type: Int!
                resolve: '@=query("App\\GraphQL\\Query\\PingQuery::ping")'
            publishedDigestDates:
                type: '[String!]!'
                resolve: '@=query("App\\GraphQL\\Query\\DigestQuery::publishedDigestDates")'
                complexity: '@=1'
            digest:
                type: Digest
                args:
                    date: String!
                resolve: '@=query("App\\GraphQL\\Query\\DigestQuery::digest", args["date"])'
                complexity: '@=childrenComplexity + 1'
            availableSiteSources:
                type: '[SiteSource!]!'
                resolve: '@=query("App\\GraphQL\\Query\\AvailableSiteSourcesQuery::availableSiteSources")'
                complexity: '@=childrenComplexity * 30 + 1'
            runStatus:
                type: RunStatus
                args:
                    runId: ID!
                resolve: '@=query("App\\GraphQL\\Query\\RunStatusQuery::runStatus", args["runId"])'
                complexity: '@=childrenComplexity + 1'

RunStatus:
    type: object
    config:
        fields:
            runId:
                type: ID!
            status:
                type: String!
            error:
                type: String
            createdAt:
                type: String!
            startedAt:
                type: String
            finishedAt:
                type: String
            files:
                type: '[String!]!'
            diagnostics:
                type: RunDiagnostics!
                complexity: '@=childrenComplexity + 1'

SiteSource:
    type: object
    config:
        fields:
            id:
                type: ID!
            name:
                type: String!
            taskUrl:
                type: String!
            searchDomain:
                type: String!
            status:
                type: String!

RunDiagnostics:
    type: object
    config:
        fields:
            collectionRunId:
                type: String
            digestRunId:
                type: String
            counts:
                type: RunDiagnosticCounts!
                complexity: '@=childrenComplexity + 1'
            warnings:
                type: '[String!]!'
            materials:
                type: '[RunDiagnosticMaterial!]!'
                complexity: '@=childrenComplexity * 200 + 1'

RunDiagnosticCounts:
    type: object
    config:
        fields:
            candidates:
                type: Int!
            collected:
                type: Int!
            imported:
                type: Int!
            included:
                type: Int!
            merged:
                type: Int!
            excluded:
                type: Int!
            events:
                type: Int!

RunDiagnosticMaterial:
    type: object
    config:
        fields:
            id:
                type: ID!
            url:
                type: String
            title:
                type: String
            stage:
                type: String!
            status:
                type: String!
            group:
                type: String
            reason:
                type: String
            error:
                type: String
