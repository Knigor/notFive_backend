Mutation:
    type: object
    config:
        fields:
            login:
                type: AdminLoginPayload!
                args:
                    input: AdminLoginInput!
                resolve: '@=mutation("App\\GraphQL\\Mutation\\AdminLoginMutation::login", args["input"])'
                complexity: '@=childrenComplexity + 1'
            startRun:
                type: RunStartPayload!
                args:
                    input: RunStartInput!
                resolve: '@=mutation("App\\GraphQL\\Mutation\\StartRunMutation::startRun", args["input"])'
                complexity: '@=childrenComplexity + 1'

AdminLoginInput:
    type: input-object
    config:
        fields:
            username:
                type: String!
            password:
                type: String!

AdminLoginPayload:
    type: object
    config:
        fields:
            token:
                type: String!
            expiresIn:
                type: Int!

RunStartInput:
    type: input-object
    config:
        fields:
            file:
                type: Upload
            sourceIds:
                type: '[ID!]'
            controlTime:
                type: String

RunStartPayload:
    type: object
    config:
        fields:
            runId:
                type: ID!
            imported:
                type: Int!
            rejected:
                type: Int!
            siteCount:
                type: Int!
            inputKind:
                type: String!
            dispatchStatus:
                type: String!
            status:
                type: String!

Upload:
    type: custom-scalar
    config:
        scalarType: '@=newObject("Overblog\\GraphQLBundle\\Upload\\Type\\GraphQLUploadType")'
