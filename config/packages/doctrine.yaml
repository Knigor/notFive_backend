doctrine:
    dbal:
        driver: pdo_pgsql
        host: '%env(POSTGRES_HOST)%'
        port: '%env(int:POSTGRES_PORT)%'
        dbname: '%env(POSTGRES_DB)%'
        user: '%env(POSTGRES_USER)%'
        password: '%env(POSTGRES_PASSWORD)%'
        server_version: '17'
        charset: UTF8
    orm:
        auto_mapping: false
