security:
    password_hashers:
        App\Security\AdminUser: 'auto'

    providers:
        admin_users:
            id: App\Security\AdminUserProvider

    firewalls:
        api:
            pattern: ^/api/(graphql|runs)
            stateless: true
            provider: admin_users
            jwt: ~

    access_control:
        - { path: ^/api/runs, roles: ROLE_ADMIN }
